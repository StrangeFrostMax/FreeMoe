name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    # The kernels are compiled for the baseline ISA; AVX2/FMA paths are selected
    # at runtime, so a stock hosted runner exercises the same code this project
    # ships. `make zen3-fallback` is the separate Zen 3 evidence target and runs
    # on the real machine, not here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3
          g++ --version | head -1
          python3 --version
      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" all build/tests build/vnpu-selftest build/fuzz_gguf 2>&1 | tee build.log
      # A failing build on a hosted runner is only diagnosable if the error text
      # is reachable without downloading the raw log. Annotating the first few
      # errors puts them on the check run itself, in the PR.
      - name: Report build errors
        if: failure()
        run: |
          grep -nE "error:|Error [0-9]+|No rule to make target" build.log | head -20 |
            while IFS= read -r line; do echo "::error title=build::$line"; done
          exit 1
      - name: Unit and architecture tests
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log
      # Same reasoning as the build step: without this, a failing test surfaces
      # only as "exit code 1" on the check run, because the raw log is behind a
      # short-lived blob URL. Annotate the failing lines and the tail.
      - name: Report test failures
        if: failure()
        run: |
          grep -nE "\[FAIL\]|FAILED|Traceback|Error|error:|failures" test.log | head -25 |
            while IFS= read -r line; do echo "::error title=tests::$line"; done
          tail -25 test.log | while IFS= read -r line; do echo "::error title=tests tail::$line"; done
          exit 1
      - name: Fixture and table regeneration checks
        run: |
          python3 tools/gen_quant_tables.py --check
          python3 tools/quant_reference.py --check
          python3 tools/make_arch_fixtures.py --check
          python3 tools/gen_unicode_tables.py --check
          python3 scripts/check_architecture.py
          python3 scripts/check_dependencies.py
